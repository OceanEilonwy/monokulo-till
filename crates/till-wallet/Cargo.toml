[package]
name = "till-wallet"
version = "0.1.0"
description = "The device's own wallet as a payment backend: Fob's wallet in Manual Sync, its keys, its prices and Connect to Fob"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
# Connect to Fob (connect.rs) and wallet codes (uri.rs).
fob-codes.workspace = true
# View-only keys from an address and view key, or from seed words.
fob-keys.workspace = true
# Fiat to XMR (docs/view-key-mode.md §8), and how a currency is written.
fob-monero.workspace = true
fob-price.workspace = true
# The wallet itself, in Manual Sync (docs/view-key-mode.md §5).
fob-wallet.workspace = true
futures-util.workspace = true
monokulo-client.workspace = true
# The wallet file's random key.
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
till-payments.workspace = true
till-types.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
