[package]
name = "orf-codec-ffi"
version = "0.1.0"
description = "orf-codec for Kotlin and Swift, through UniFFI: an ORF receipt (as JSON) appended to a payment URI"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A plain Rust library now: monokular-ffi links it into the one library the
# apps load, and generates its bindings (docs/ios-plan.md §2).
[lib]
name = "orf_codec_ffi"

[dependencies]
orf-codec = { path = "../orf-codec" }
serde_json = "1"
thiserror = "2"
uniffi.workspace = true
