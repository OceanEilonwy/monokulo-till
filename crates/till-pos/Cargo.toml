[package]
name = "till-pos"
version = "0.1.0"
description = "Till's points of sale: signing in to Square and Clover, finding Monero sales in them, and turning their orders into receipts"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["square", "clover"]
# Square: OAuth with PKCE, and the Payments, Orders, Locations and Refunds APIs.
square = []
# Clover: low-trust OAuth with PKCE, the /v3 REST API and the Monero tender.
clover = []

[dependencies]
monokulo-client.workspace = true
orf-codec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# SaleSource and the refund traits are used as trait objects by the till.
async-trait.workspace = true
base64.workspace = true
getrandom = "0.3.4"
# RFC 3339 times, and receipts in the merchant's time zone from the device's
# own time zone database (Android's and Apple's).
jiff = "0.2.16"
reqwest = { workspace = true, features = ["rustls", "json"] }
sha2.workspace = true

[dev-dependencies]
wiremock.workspace = true
