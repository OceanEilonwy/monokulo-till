[workspace]
resolver = "3"
members = ["crates/*", "tools/receipt-qr", "tools/screenshot-compare", "tools/square-sandbox"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/OceanEilonwy/monokular"

# The Rust core's shared dependencies (docs/ios-plan.md §2). The leaf crates
# (monokulo-client, pos, till, bell) never take uniffi: only till-app
# does, behind its `uniffi` feature, and CI checks it.
[workspace.dependencies]
monokulo-client = { path = "crates/monokulo-client" }
till-pos = { path = "crates/till-pos" }
till-sales = { path = "crates/till-sales" }
till-payments = { path = "crates/till-payments" }
till-bell = { path = "crates/till-bell" }
till-app = { path = "crates/till-app" }
till-screens = { path = "crates/till-screens" }
till-types = { path = "crates/till-types" }
till-ledger = { path = "crates/till-ledger" }
orf-codec = { path = "crates/orf-codec" }
orf-codec-ffi = { path = "crates/orf-codec-ffi" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "=0.32.2"
# Shared by the leaf crates, one version each. reqwest's features are each
# crate's own: rustls for those that make requests, json, socks, stream.
async-trait = "0.1.89"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
sha2 = "0.11.1"
wiremock = "0.6.5"
# The ledger's database (docs/ledger.md §4, §11): SQLCipher compiled into the
# library, never the system's SQLite. On Apple targets it encrypts with
# CommonCrypto; elsewhere with OpenSSL's libcrypto, which till-ffi vendors
# for Android (docs/decisions/core.md 150).
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled-sqlcipher"] }
# Fob as a library (docs/view-key-mode.md §3, §5): the device's own wallet
# in Manual Sync, its keys, its codes (wallet codes and Connect to Fob) and
# its prices, at one commit of monokulo-fob. fob-wallet's default features
# vendor OpenSSL for SQLCipher; Till brings its own (till-ffi on Android,
# CommonCrypto on Apple: core.md decisions 150 and 229), so they're off.
# fob-wallet's rusqlite and Till's must be one version: one SQLCipher links.
fob-wallet = { git = "https://github.com/OceanEilonwy/monokulo-fob", rev = "ed061f30c758333be8c6bf8843428063f5a59d53", default-features = false }
fob-keys = { git = "https://github.com/OceanEilonwy/monokulo-fob", rev = "ed061f30c758333be8c6bf8843428063f5a59d53" }
fob-codes = { git = "https://github.com/OceanEilonwy/monokulo-fob", rev = "ed061f30c758333be8c6bf8843428063f5a59d53" }
fob-price = { git = "https://github.com/OceanEilonwy/monokulo-fob", rev = "ed061f30c758333be8c6bf8843428063f5a59d53" }
till-wallet = { path = "crates/till-wallet" }
zeroize = "1.8"

# monero-oxide's curve arithmetic and SQLCipher's key derivation are slow
# unoptimised: a test that makes a wallet file takes minutes without this.
# Fob's workspace optimises every dependency the same way.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.monero-oxide]
opt-level = 3
[profile.dev.package.monero-wallet]
opt-level = 3
[profile.dev.package.monero-io]
opt-level = 3
[profile.dev.package.monero-primitives]
opt-level = 3
[profile.dev.package.monero-ed25519]
opt-level = 3
[profile.dev.package.monero-bulletproofs-generators]
opt-level = 3
[profile.dev.package.monero-address]
opt-level = 3
[profile.dev.package.monero-borromean]
opt-level = 3
[profile.dev.package.monero-mlsag]
opt-level = 3
[profile.dev.package.monero-clsag]
opt-level = 3
[profile.dev.package.monero-bulletproofs]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.fob-scanner]
opt-level = 3
[profile.dev.package.fob-keys]
opt-level = 3
[profile.dev.package.polyseed]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

# orf-codec-ffi's library as the Android app ships it, once per ABI: small.
# (Release builds for this machine keep the defaults: UniFFI's bindgen reads
# its metadata from symbols that LTO and stripping remove.)
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true
