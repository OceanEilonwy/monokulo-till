[workspace]
resolver = "3"
members = ["crates/*", "tools/receipt-qr", "tools/screenshot-compare", "tools/square-sandbox"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/OceanEilonwy/monokular"

# The Rust core's shared dependencies (docs/ios-plan.md §2). The leaf crates
# (monokulo-client, pos, till, bell) never take uniffi: only till-app
# does, behind its `uniffi` feature, and CI checks it.
[workspace.dependencies]
monokulo-client = { path = "crates/monokulo-client" }
till-pos = { path = "crates/till-pos" }
till-sales = { path = "crates/till-sales" }
till-payments = { path = "crates/till-payments" }
till-bell = { path = "crates/till-bell" }
till-app = { path = "crates/till-app" }
till-screens = { path = "crates/till-screens" }
till-types = { path = "crates/till-types" }
till-ledger = { path = "crates/till-ledger" }
orf-codec = { path = "crates/orf-codec" }
orf-codec-ffi = { path = "crates/orf-codec-ffi" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "=0.32.2"
# Shared by the leaf crates, one version each. reqwest's features are each
# crate's own: rustls for those that make requests, json, socks, stream.
async-trait = "0.1.89"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
sha2 = "0.11.1"
wiremock = "0.6.5"
# The ledger's database (docs/ledger.md §4, §11): SQLCipher compiled into the
# library, never the system's SQLite. On Apple targets it encrypts with
# CommonCrypto; elsewhere with OpenSSL's libcrypto, which till-ffi vendors
# for Android (docs/decisions/core.md 150).
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled-sqlcipher"] }

# orf-codec-ffi's library as the Android app ships it, once per ABI: small.
# (Release builds for this machine keep the defaults: UniFFI's bindgen reads
# its metadata from symbols that LTO and stripping remove.)
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true
