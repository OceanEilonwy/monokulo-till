<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: cash payments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: rgba(26, 25, 23, 0.35); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1A1917; display: flex; align-items: center; justify-content: center;">
  <section aria-label="Settings" style="width: 620px; height: 720px; border-radius: 28px; background: #F4F1EA; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3); box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px;">
    <nav style="display: flex; align-items: center; min-height: 44px;">
      <span style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600; padding-left: 80px;">Settings</span>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: rgba(255, 255, 255, 0.85); font: inherit; font-size: 17px; font-weight: 600;">Done</button>
    </nav>

    <span style="font-size: 13px; color: #5A564C; padding: 12px 16px 0;">CASH IN SQUARE</span>
    <div role="radiogroup" aria-label="Cash in Square" style="background: #FFFFFF; border-radius: 12px; overflow: hidden;">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border: 0; border-bottom: 1px solid #ECE6DA; background: none; font: inherit; color: #1A1917; text-align: left; cursor: pointer;">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px;">{{o.title}}</span><span style="font-size: 13px; line-height: 18px; color: #5A564C;">{{o.text}}</span></span>
          <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="#1A1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{allCash}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px;"><path d="M12 3l10 18H2z" fill="none" stroke="#7D5E00" stroke-width="2.2" stroke-linejoin="round"></path><path d="M12 10v5M12 18v.5" stroke="#7D5E00" stroke-width="2.2" stroke-linecap="round"></path></svg>
        <span style="font-size: 13px; line-height: 18px; color: #7D5E00;">Every cash sale alerts and shows a code. When a customer pays real cash, tap Paid in cash on the sale to close it.</span>
      </div>
    </sc-if>
    <span style="font-size: 13px; line-height: 18px; color: #5A564C; padding: 0 16px;">Square still records these sales as Cash. Till's shift lists which ones were paid in Monero, for the end-of-day count.</span>
  </section>
  <div style="position: absolute; left: 0; top: 0;"><dc-import name="WindowControls" hint-size="120px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'all' }; }
  renderVals() {
    const options = [
      { id: 'all', title: 'Treat cash sales as Monero (default)', text: 'Cash sales alert and get a code straight away. If the customer pays real cash, tap Paid in cash.' },
      { id: 'offer', title: 'Ignore cash sales', text: 'Only sales rung up as Other: Monero alert. Cash sales are skipped completely: no alert, no code, not in the list.' },
    ].map((o) => ({ ...o, on: this.state.pick === o.id, checked: this.state.pick === o.id ? 'true' : 'false', pick: () => this.setState({ pick: o.id }) }));
    return { options, allCash: this.state.pick === 'all' };
  }
}
</script>
</body>
</html>
