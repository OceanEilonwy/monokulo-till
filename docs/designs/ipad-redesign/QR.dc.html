<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QR placeholder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Payment code" style="width: {{px}}; height: {{px}}; box-sizing: border-box; padding: {{pad}}; background: #ffffff; border-radius: 8px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); grid-auto-rows: 1fr;">
  <sc-for list="{{cells}}" as="cell" hint-placeholder-count="625">
    <span style="background: {{cell.bg}};"></span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":200,"min":40,"max":600},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 200);
    const n = 25;
    const finder = (r, c) => {
      const spots = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (const [fr, fc] of spots) {
        const y = r - fr, x = c - fc;
        if (y >= 0 && y < 7 && x >= 0 && x < 7) {
          const edge = y === 0 || y === 6 || x === 0 || x === 6;
          const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
          return edge || core ? 1 : 0;
        }
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return -1;
    };
    const cells = [];
    let seed = 7;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        seed = (seed * 1103515245 + 12345) % 2147483648;
        const f = finder(r, c);
        const on = f === -1 ? (seed >> 16) % 2 === 1 : f === 1;
        cells.push({ bg: on ? '#1a1917' : 'transparent' });
      }
    }
    return { px: size + 'px', pad: Math.round(size * 0.06) + 'px', cells };
  }
}
</script>
</body>
</html>
