<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert tapped: the sale full screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b34700}a:hover{color:#1a1917}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #f4f1ea; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1a1917; display: flex; flex-direction: column; box-sizing: border-box; padding: 24px 32px 28px;">

  <nav style="display: flex; align-items: center; gap: 12px; padding-left: 112px;">
    <a href="Main.dc.html" aria-label="Back to the shift" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #dcd5c7; background: rgba(255, 255, 255, 0.75); display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="#1a1917" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <span style="font-size: 28px; font-weight: 700;">Sam</span>
      <span style="font-size: 13px; color: #5a564c;">Sale #bP9m · Front iPad</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #f8dede; color: #b00020; font: inherit; font-size: 15px; font-weight: 600;">Close the sale</button>
  </nav>

  <main style="flex-grow: 1; display: flex; gap: 56px; align-items: center; justify-content: center;">
    <section aria-label="For the customer" style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div style="padding: 18px; background: #ffffff; border-radius: 28px; box-shadow: 0 10px 30px rgba(26, 25, 23, 0.12);">
        <dc-import name="QR" size="380" hint-size="380px,380px"></dc-import>
      </div>
      <span style="font-family: Manrope, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -0.5px;">$24.50</span>
      <span style="font-size: 17px; color: #5a564c;">0.1342 XMR · Scan with your Monero wallet</span>
    </section>

    <aside style="width: 340px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #ffffff;">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="#dcd5c7" stroke-width="3"></circle><path d="M13 2.5a10.5 10.5 0 0 1 9.6 6.2" fill="none" stroke="#b34700" stroke-width="3" stroke-linecap="round"></path></svg>
        <span style="flex-grow: 1; font-size: 16px;">Waiting for payment</span>
        <span style="font-size: 16px; font-variant-numeric: tabular-nums; color: #5a564c;">14:32</span>
      </div>
      <div style="background: #ffffff; border-radius: 14px; overflow: hidden;">
        <div style="display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #ece6da; font-size: 16px;"><span>Flat white ×2</span><span>$9.00</span></div>
        <div style="display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #ece6da; font-size: 16px;"><span>Banana bread</span><span>$4.50</span></div>
        <div style="display: flex; justify-content: space-between; padding: 14px 16px; font-size: 16px;"><span>Beans 250g</span><span>$11.00</span></div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5a564c;">Turn the iPad towards the customer. Till goes back to the shift by itself once the sale is paid.</p>
    </aside>
  </main>

  <div style="display: flex; justify-content: center;">
    <a href="AlertPaid.dc.html" style="font-size: 15px;">Preview: the customer pays →</a>
  </div>
  <div style="position: absolute; left: 0; top: 0;"><dc-import name="WindowControls" hint-size="120px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
