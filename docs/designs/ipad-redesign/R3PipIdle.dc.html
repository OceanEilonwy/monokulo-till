<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating window over Square, watching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b34700}a:hover{color:#1a1917}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #ececec; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1a1917;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 18px; box-sizing: border-box;">
    <span style="font-size: 15px; font-weight: 700; color: #555555;">[Square POS, full screen]</span>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px;">
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
      <div style="height: 132px; border-radius: 14px; background: #dcdcdc;"></div>
    </div>
  </div>

  <a href="R3PipSale.dc.html" aria-label="Till floating window: watching for Monero sales" style="position: absolute; right: 24px; bottom: 32px; width: 124px; height: 44px; border-radius: 12px; overflow: hidden; background: #1a1917; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); display: flex; align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box; text-decoration: none; color: #ffffff;">
    <dc-import name="TillWidget" size="28" state="idle" dark="{{yes}}" hint-size="28px,28px"></dc-import>
    <span style="font-size: 14px; font-weight: 700; white-space: nowrap;">Watching</span>
  </a>

  <div style="position: absolute; right: 24px; bottom: 92px; width: 300px; display: flex; justify-content: flex-end;">
    <span style="padding: 8px 14px; border-radius: 16px; background: #ffffff; border: 1px solid #dcd5c7; font-size: 13px; color: #3a3a3a;">Small strip (124 × 44 pt) while watching · becomes a 200 pt square only for a code</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
