<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash sale in the floating strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B34700}a:hover{color:#1A1917}
</style>
</helmet>
<div style="width: 1180px; height: 820px; position: relative; overflow: hidden; background: #ececec; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1A1917;">
  <div style="position: absolute; top: 0; left: 0; width: 760px; height: 820px; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 14px; box-sizing: border-box;">
    <span style="font-size: 15px; font-weight: 700; color: #555555;">[Square POS · choose payment · $24.50 · Sam]</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
      <div style="height: 96px; border-radius: 14px; background: #dcdcdc; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #3a3a3a;">Card</div>
      <div style="height: 96px; border-radius: 14px; background: #b9b9b9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #1a1917;">Cash<span style="font-size: 13px; font-weight: 500;">tapped</span></div>
      <div style="height: 96px; border-radius: 14px; background: #dcdcdc; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #3a3a3a;">Other</div>
    </div>
  </div>

  <div style="position: absolute; right: 24px; bottom: 32px; height: 64px; border-radius: 16px; overflow: hidden; background: #1A1917; box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35); display: flex; align-items: center; gap: 10px; padding: 0 20px 0 16px; box-sizing: border-box; color: #FFFFFF;">
    <dc-import name="StatusGlyph" size="28" state="cash" dark="{{yes}}" hint-size="28px,28px"></dc-import>
    <span style="display: flex; flex-direction: column; min-width: 0;">
      <span style="font-size: 17px; font-weight: 700;">Sam · $24.50</span>
      <span style="font-size: 13px; color: #D9D4C9;">Cash · paying in Monero?</span>
    </span>
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); display: {{controls}}; align-items: center; justify-content: center;">
      <span style="position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 13px; background: rgba(60,60,60,0.85); display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>
      <span style="position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 13px; background: rgba(60,60,60,0.85); display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 14 14"><path d="M8 1h5v5M13 1L8 6M6 13H1V8M1 13l5-5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="#1A1917"></path></svg></span>
    </div>
  </div>

  <div style="position: absolute; right: 300px; bottom: 140px; width: 360px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
    <span style="padding: 8px 14px; border-radius: 16px; background: #1A1917; color: #FFFFFF; font-size: 13px; font-weight: 600;">A cash sale shows quietly: no alert, no code yet</span>
    <span style="padding: 8px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCD5C7; font-size: 13px; color: #3A3A3A; text-align: right;">Tap the strip, then ▶ (the system's play control): Till takes it in Monero. Or ⤢ to use the button in Till.</span>
  </div>
  <a href="CashPipCode.dc.html" style="position: absolute; left: 24px; bottom: 28px; font-size: 15px;">Preview: ▶ tapped →</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showControls":{"editor":"boolean","default":true},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, controls: (this.props.showControls ?? true) ? 'flex' : 'none' }; }
}
</script>
</body>
</html>
