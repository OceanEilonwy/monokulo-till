name: iOS

# Till for iPhone and iPad (docs/ios-plan.md §5, §7): the Rust core built for
# the simulator, the app generated by XcodeGen, and its tests on an iPhone
# and an iPad. macOS minutes cost about ten times Linux's, so this runs only
# when the app or the core changes.
on:
  push:
    branches: [main]
    paths: ["ios/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The Xcode 27 image (macOS 27, arm64): macos-26's newest Xcode is 26.6.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # The app builds with Xcode 27's SDK for iOS 26.7 and newer (ios-plan
      # §5): the newest Xcode 27 the runner has.
      - name: Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          if ! xcodebuild -version | grep -q '^Xcode 27'; then
            echo "::error::This runner image has no Xcode 27"
            exit 1
          fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      # The core's deployment target, in the cache's key: a cache of
      # dependencies built for another iOS would link with warnings.
      - name: Deployment target
        id: deployment
        run: echo "target=$(sed -n 's/^export IPHONEOS_DEPLOYMENT_TARGET=//p' ios/Scripts/build-core.sh)" >> "$GITHUB_OUTPUT"
      # Compiled dependencies only, pruned, falling back to the last cache
      # when Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-${{ steps.deployment.outputs.target }}
      - name: XcodeGen
        run: brew install xcodegen && xcodegen --version
      # The simulator's slice only; release builds make both (build-core.sh).
      - name: The core as TillFFI.xcframework, with its Swift bindings
        run: ios/Scripts/build-core.sh --sim
      - name: Generate Till.xcodeproj
        working-directory: ios
        run: xcodegen generate
      # The newest iPhone on an iOS 27 runtime, and an iPad on the oldest
      # runtime Till supports (iOS 26.7 or a newer 26.x), so a call into an
      # iOS 27-only API fails here as well as at compile time. Without a 26.x
      # runtime on the image the iPad falls back to iOS 27, with a warning.
      - name: Simulators
        id: simulators
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          family, major = sys.argv[1], sys.argv[2]
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"\d+", runtime.rsplit(".", 1)[-1]))
          # iOS 26: the oldest runtime from 26.7 on; iOS 27: the newest.
          runtimes = sorted(
              (r for r in devices if f"iOS-{major}-" in r and version(r) >= (26, 7)),
              key=version, reverse=(major != "26"))
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith(family):
                      print(device["udid"]); sys.exit(0)
          sys.exit(1)' "$1" "$2"
          }
          iphone="$(pick iPhone 27)" || { echo "::error::No iPhone simulator on iOS 27"; exit 1; }
          if ! ipad="$(pick iPad 26)"; then
            echo "::warning::No iPad simulator on iOS 26.7 or a newer 26.x; testing the iPad on iOS 27"
            ipad="$(pick iPad 27)" || { echo "::error::No iPad simulator on iOS 27"; exit 1; }
          fi
          echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"
      # The layout's pictures (TillTests/LayoutSnapshotTests.swift): each
      # iPad window size, drawn on the iPad simulator, kept as an artifact.
      - name: Test on iPhone and iPad
        working-directory: ios
        run: |
          mkdir -p "$RUNNER_TEMP/layout-snapshots"
          TEST_RUNNER_SNAPSHOT_DIR="$RUNNER_TEMP/layout-snapshots" \
          xcodebuild test \
            -project Till.xcodeproj -scheme Till \
            -destination "id=${{ steps.simulators.outputs.iphone }}" \
            -destination "id=${{ steps.simulators.outputs.ipad }}" \
            -resultBundlePath "$RUNNER_TEMP/Till.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: till-ios-test-results
          path: ${{ runner.temp }}/Till.xcresult
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: till-ios-layout-snapshots
          path: ${{ runner.temp }}/layout-snapshots
          retention-days: 14
          if-no-files-found: ignore
