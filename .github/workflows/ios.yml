name: iOS

# Till for iPhone and iPad (docs/ios-plan.md §5, §7): the Rust core built for
# the simulator, the app generated by XcodeGen, and its tests on an iPhone
# and an iPad. macOS minutes cost about ten times Linux's, so this runs only
# when the app or the core changes.
on:
  push:
    branches: [main]
    paths: ["ios/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The Xcode 27 image (macOS 27, arm64): macos-26's newest Xcode is 26.6.
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # iOS 27 is the minimum (ios-plan §5), so the app needs Xcode 27's SDK:
      # the newest Xcode 27 the runner has.
      - name: Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          if ! xcodebuild -version | grep -q '^Xcode 27'; then
            echo "::error::This runner image has no Xcode 27"
            exit 1
          fi
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      # Compiled dependencies only, pruned, falling back to the last cache
      # when Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
      - name: XcodeGen
        run: brew install xcodegen && xcodegen --version
      # The simulator's slice only; release builds make both (build-core.sh).
      - name: The core as TillFFI.xcframework, with its Swift bindings
        run: ios/Scripts/build-core.sh --sim
      - name: Generate Till.xcodeproj
        working-directory: ios
        run: xcodegen generate
      # The newest iPhone and iPad simulators on an iOS 27 runtime.
      - name: Simulators
        id: simulators
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          family = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS-27" in r), reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith(family):
                      print(device["udid"]); sys.exit(0)
          sys.exit("no " + family + " simulator on iOS 27")' "$1"
          }
          echo "iphone=$(pick iPhone)" >> "$GITHUB_OUTPUT"
          echo "ipad=$(pick iPad)" >> "$GITHUB_OUTPUT"
      - name: Test on iPhone and iPad
        working-directory: ios
        run: |
          xcodebuild test \
            -project Till.xcodeproj -scheme Till \
            -destination "id=${{ steps.simulators.outputs.iphone }}" \
            -destination "id=${{ steps.simulators.outputs.ipad }}" \
            -resultBundlePath "$RUNNER_TEMP/Till.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: till-ios-test-results
          path: ${{ runner.temp }}/Till.xcresult
          retention-days: 14
          if-no-files-found: ignore
