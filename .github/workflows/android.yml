name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/**", "Cargo.*", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/**", "Cargo.*", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar and caches Gradle's dependencies and build cache.
      - uses: gradle/actions/setup-gradle@v6
      # The AndroidX libraries in use compile against Android 17 (API 37.2).
      - name: Install Android SDK platform and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "ndk;27.0.12077973" > /dev/null
      # The ffi module builds the Rust core, till-ffi, for each ABI (docs/decisions/core.md 3).
      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      # Compiled dependencies only, pruned, falling back to the last cache
      # when Cargo.lock changes; cargo-ndk's binary with them.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked
      # Pull requests build the Rust core for one ABI with the plain release
      # profile; main builds every ABI with LTO, as a release does.
      - name: Build, lint and test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew build -Ptill.rust.abis=arm64-v8a -Ptill.rust.profile=release
          else
            ./gradlew build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: till-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
