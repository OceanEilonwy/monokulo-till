name: Pages

# site/: the debug build's Square and Clover sign-in pages (site/square/debug/,
# site/clover/debug/), the iOS app's apple-app-site-association with its
# team filled in, and the Android app's assetlinks.json with its release key's
# fingerprint.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The AASA file names the iOS app by its team: the APPLE_TEAM_ID
      # repository variable that release-ios.yml signs with (docs/release.md)
      # takes the place of the TEAMID placeholder. Without it the site still
      # deploys, and universal links wait for the variable and another run.
      - name: The app's team in apple-app-site-association
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cp -R site "$RUNNER_TEMP/site"
          aasa="$RUNNER_TEMP/site/.well-known/apple-app-site-association"
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::No APPLE_TEAM_ID repository variable: apple-app-site-association keeps its TEAMID placeholder, so universal links won't open Till (docs/release.md)"
          elif ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID doesn't look like an Apple Developer team ID (10 letters and digits)"
            exit 1
          else
            sed -i "s/\"TEAMID\./\"$APPLE_TEAM_ID./g" "$aasa"
            grep -q "\"$APPLE_TEAM_ID.com.monokulo.till\"" "$aasa"
          fi
          python3 -m json.tool "$aasa"
      # assetlinks.json names the Android release build by its signing
      # certificate: the ANDROID_CERT_SHA256 repository variable, which
      # release-android.yml prints in its summary (docs/release.md), takes the
      # place of the ANDROID_CERT_SHA256 placeholder. Without it the release
      # build's sign-ins open in the browser instead of coming back to Till.
      - name: The release key in assetlinks.json
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          links="$RUNNER_TEMP/site/.well-known/assetlinks.json"
          if [ -z "$ANDROID_CERT_SHA256" ]; then
            echo "::warning::No ANDROID_CERT_SHA256 repository variable: assetlinks.json keeps its placeholder, so the Android release build's sign-ins won't come back to Till (docs/release.md)"
          elif ! printf '%s' "$ANDROID_CERT_SHA256" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then
            echo "::error::ANDROID_CERT_SHA256 doesn't look like a SHA-256 certificate fingerprint (32 upper-case hex pairs joined by colons)"
            exit 1
          else
            sed -i "s/\"ANDROID_CERT_SHA256\"/\"$ANDROID_CERT_SHA256\"/" "$links"
            grep -q "\"$ANDROID_CERT_SHA256\"" "$links"
          fi
          python3 -m json.tool "$links"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site/
          # .well-known (the AASA file) and .nojekyll, which v5 leaves out
          # by default.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
