# Till for iPhone and iPad (docs/ios-plan.md §5), generated by XcodeGen:
#   ../ios/Scripts/build-core.sh && xcodegen generate
# No .xcodeproj is committed.
name: Till
options:
  bundleIdPrefix: com.monokulo
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  TillCore:
    path: Packages/TillCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The version TestFlight and the App Store show; release-ios.yml sets
    # the build number (CURRENT_PROJECT_VERSION) to its run number, for
    # the app and its extensions alike (docs/release.md).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing for every target: Xcode's automatic signing under the team in
    # TILL_TEAM_ID, which release-ios.yml passes from the APPLE_TEAM_ID
    # variable; a local build takes it from the environment
    # (export TILL_TEAM_ID=…) or Xcode's Signing & Capabilities. Builds
    # without a team pass CODE_SIGNING_ALLOWED=NO, as ios.yml's do.
    DEVELOPMENT_TEAM: $(TILL_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Till:
    type: application
    platform: iOS
    sources: [Till]
    dependencies:
      - package: TillCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.till
        PRODUCT_NAME: Till
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # The URL scheme, which no INFOPLIST_KEY_ setting can say; merged with
        # the generated keys.
        INFOPLIST_FILE: Support/Info.plist
        # Associated Domains for universal links. CI builds unsigned
        # (CODE_SIGNING_ALLOWED=NO), so no team is needed until release.
        CODE_SIGN_ENTITLEMENTS: Support/Till.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Till
        # App Store Connect refuses an upload without one (Support/AppIcon.svg).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Till uses the camera to scan your store's connect code."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
  TillTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TillTests]
    # TillCore reaches the tests through the app (Till/Exports.swift), so the
    # static library is linked once, into the app the tests run in.
    dependencies:
      - target: Till
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.till.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Till.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Till"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Till:
    build:
      targets:
        Till: all
        TillTests: [test]
    test:
      targets: [TillTests]
